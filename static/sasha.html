<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  <title>Home</title>
  <style>
    :root {
      --bg: #000;
      --card: rgba(28, 28, 30, 0.92);
      --inset: rgba(44, 44, 46, 0.9);
      --text: #f5f5f7;
      --muted: rgba(235, 235, 245, 0.55);
      --faint: rgba(235, 235, 245, 0.32);
      --green: #30d158;
      --green-soft: rgba(48, 209, 88, 0.18);
      --amber: #ffd60a;
      --red: #ff453a;
      --blue: #64d2ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100%;
    }
    body { padding: 28px 28px 48px; }
    .grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      grid-template-areas:
        "power power"
        "climate house";
      gap: 14px;
    }
    .card {
      background: var(--card);
      border-radius: 28px;
      padding: 22px 24px 20px;
    }
    .power { grid-area: power; }
    .climate { grid-area: climate; }
    .house { grid-area: house; }
    .label {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .row { display: flex; gap: 36px; align-items: center; }
    .hero {
      font-size: 56px;
      font-weight: 630;
      letter-spacing: -0.045em;
      line-height: 1;
    }
    .hero small {
      font-size: 20px;
      font-weight: 500;
      color: var(--muted);
      margin-left: 4px;
    }
    .phases { flex: 1; display: flex; flex-direction: column; gap: 12px; }
    .phase {
      display: grid;
      grid-template-columns: 22px 1fr;
      gap: 12px;
      align-items: center;
    }
    .phase span { font-size: 13px; font-weight: 600; color: var(--muted); }
    .bar {
      height: 8px;
      background: rgba(255,255,255,0.08);
      border-radius: 99px;
      overflow: hidden;
    }
    .bar i {
      display: block;
      height: 100%;
      border-radius: 99px;
      background: var(--blue);
    }
    .bar.hot i { background: var(--amber); }
    .price-row { display: flex; align-items: baseline; gap: 12px; margin: 22px 0 14px; }
    .price { font-size: 34px; font-weight: 630; letter-spacing: -0.03em; }
    .price small { font-size: 16px; color: var(--muted); font-weight: 500; margin-left: 3px; }
    .chart-wrap { position: relative; height: 88px; border-radius: 16px; overflow: visible; }
    .cheap {
      position: absolute;
      top: 0; bottom: 0;
      background: var(--green-soft);
      border: 1.5px solid rgba(48, 209, 88, 0.45);
      border-radius: 12px;
      pointer-events: none;
    }
    .now-line {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 3px;
      margin-left: -1.5px;
      background: #fff;
      z-index: 3;
      pointer-events: none;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.5), 0 0 16px rgba(255,255,255,0.85);
    }
    .now-line::before,
    .now-line::after {
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 9px;
      height: 9px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(255,255,255,0.9);
    }
    .now-line::before { top: -1px; }
    .now-line::after { bottom: -1px; }
    .chart {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      align-items: flex-end;
      gap: 2px;
      padding: 8px 6px 6px;
    }
    .chart .col { flex: 1; border-radius: 2px; min-height: 3px; }
    .chart .col.past { opacity: 0.32; }
    .chart-axis {
      display: grid;
      grid-template-columns: repeat(24, 1fr);
      padding: 7px 6px 0;
      font-size: 10px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }
    .chart-axis span { text-align: center; }
    .rooms { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
    .room { background: var(--inset); border-radius: 16px; padding: 12px 14px; }
    .room .n { font-size: 12px; color: var(--muted); }
    .room .t { font-size: 24px; font-weight: 600; letter-spacing: -0.03em; margin-top: 2px; }
    .room .h { font-size: 12px; color: var(--faint); margin-top: 2px; }
    .ok {
      font-size: 17px;
      font-weight: 600;
      color: var(--green);
      background: var(--green-soft);
      border-radius: 16px;
      padding: 16px 18px;
    }
    .ok.warn { color: var(--red); background: rgba(255, 69, 58, 0.16); }
    .open-list { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; }
    .open-chip {
      background: rgba(255, 69, 58, 0.16);
      color: var(--red);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 13px;
    }
    .muted { color: var(--muted); font-size: 15px; margin-top: 6px; }
    @media (max-width: 900px) {
      body { padding: 16px; }
      .grid {
        grid-template-columns: 1fr;
        grid-template-areas: "power" "climate" "house";
      }
      .row { flex-direction: column; align-items: stretch; gap: 18px; }
      .hero { font-size: 48px; }
    }
  </style>
</head>
<body>
  <div class="grid">
    <section class="card power">
      <div class="label">Power</div>
      <div class="row">
        <div class="hero" id="kw">—<small>kW</small></div>
        <div class="phases" id="phases"></div>
      </div>
      <div class="price-row">
        <div class="price" id="price-now">—<small>öre</small></div>
      </div>
      <div class="chart-wrap">
        <div class="cheap" id="cheap" hidden></div>
        <div class="now-line" id="now-line"></div>
        <div class="chart" id="chart"></div>
      </div>
      <div class="chart-axis" id="chart-axis"></div>
    </section>

    <section class="card climate">
      <div class="label">Climate</div>
      <div class="hero" id="out-temp" style="font-size:44px">—<small>°</small></div>
      <div class="muted" id="out-desc"></div>
      <div class="rooms" id="rooms"></div>
    </section>

    <section class="card house">
      <div class="label">House</div>
      <div id="house-body"></div>
    </section>
  </div>

  <script>
    const STATUS_URLS = [
      "/api/status",
      "http://192.168.1.175:8000/api/status",
      "./status.json"
    ];
    const GREEN_CEILING = 120;
    const RED_FLOOR = 50;
    const HISTORY_KEY = "hc_price_history_v1";

    const shortName = (n) => ({
      "Hall, Entré": "Hall",
      "Hall, Övervåning, Mellan kök och vardagsrum": "Övervåning",
      "Trapp": "Trapp",
      "Living Room": "Vardagsrum"
    }[n] || n || "Room");

    function loadHistory() {
      try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || "{}"); }
      catch { return {}; }
    }
    function saveHistory(h) { localStorage.setItem(HISTORY_KEY, JSON.stringify(h)); }

    function rollingMean(history, todayAvg) {
      const days = Object.values(history).map(Number).filter(n => !isNaN(n));
      if (days.length < 2) return todayAvg || 0;
      return days.reduce((a, b) => a + b, 0) / days.length;
    }

    function band(ore, baseline) {
      if (ore < RED_FLOOR) return "good";
      if (ore > GREEN_CEILING && ore > baseline * 1.2) return "bad";
      const rel = baseline ? (ore - baseline) / baseline : 0;
      if (rel <= -0.2 && ore <= GREEN_CEILING) return "good";
      if (rel >= 0.2) return "bad";
      return "warn";
    }

    function num(...vals) {
      for (const v of vals) {
        const n = typeof v === "string" ? parseFloat(v) : v;
        if (typeof n === "number" && !isNaN(n)) return n;
      }
      return null;
    }

    function fmtKw(w) {
      if (w == null || isNaN(w)) return "—";
      const kw = Math.abs(w) >= 50 ? w / 1000 : w;
      return Math.abs(kw) >= 10 ? kw.toFixed(1) : kw.toFixed(2);
    }

    function currentSlot() {
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, "0");
      const mm = now.getMinutes() < 15 ? "00" : now.getMinutes() < 30 ? "15" : now.getMinutes() < 45 ? "30" : "45";
      return hh + ":" + mm;
    }

    function longestCheapRun(schedule, baseline) {
      let best = null, cur = null;
      schedule.forEach((x, i) => {
        if (band(x.ore, baseline) === "good") {
          if (!cur) cur = { start: i, end: i };
          else cur.end = i;
        } else if (cur) {
          if (!best || cur.end - cur.start > best.end - best.start) best = cur;
          cur = null;
        }
      });
      if (cur && (!best || cur.end - cur.start > best.end - best.start)) best = cur;
      return best;
    }

    function roomTemp(r) {
      return num(r && r.temperature, r && r.temperature_c, r && r.temp, r && r.value);
    }
    function roomHum(r) {
      return num(r && r.humidity, r && r.humidity_pct, r && r.rh);
    }

    function render(s) {
      const d = s.devices || s;
      const meter = d.smart_meter || {};
      const price = d.electricity_price || {};
      const weather = d.outside_weather || {};
      const v = d.verisure || {};
      const living = d.living_room_sensor || d.room_sensor || null;

      const l1 = num(meter.power_l1_w, meter.l1_w) || 0;
      const l2 = num(meter.power_l2_w, meter.l2_w) || 0;
      const l3 = num(meter.power_l3_w, meter.l3_w) || 0;
      const watts = num(meter.net_power_w, meter.power_delivered_w, meter.power_w, l1 + l2 + l3);
      document.getElementById("kw").innerHTML = fmtKw(watts) + "<small>kW</small>";

      const phases = [["L1", l1], ["L2", l2], ["L3", l3]];
      const maxP = Math.max(l1, l2, l3, 1);
      document.getElementById("phases").innerHTML = phases.map(([n, w]) => {
        const hot = w === maxP && w > 0;
        return `<div class="phase"><span>${n}</span><div class="bar ${hot ? "hot" : ""}"><i style="width:${(w / maxP) * 100}%"></i></div></div>`;
      }).join("");

      const ore = num(price.price_now_ore, price.ore);
      if (ore != null) {
        document.getElementById("price-now").innerHTML = Math.round(ore) + "<small>öre</small>";
      }

      const schedule = price.schedule_hourly || [];
      if (schedule.length) {
        const day = String(price.period_start || "").slice(0, 10);
        const hist = loadHistory();
        if (day && price.today_avg_ore) hist[day] = price.today_avg_ore;
        const keys = Object.keys(hist).sort();
        while (keys.length > 7) delete hist[keys.shift()];
        saveHistory(hist);
        const baseline = rollingMean(hist, price.today_avg_ore || ore);
        const now = new Date();
        const nowMin = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
        const slotMin = (t) => {
          const [hh, mm] = String(t || "00:00").split(":").map(Number);
          return (hh || 0) * 60 + (mm || 0);
        };
        const maxOre = Math.max(...schedule.map(x => x.ore), 1);
        document.getElementById("chart").innerHTML = schedule.map(x => {
          const h = Math.max(8, (x.ore / maxOre) * 100);
          const c = band(x.ore, baseline);
          const color = c === "good" ? "#30d158" : c === "bad" ? "#ff453a" : "rgba(255,214,10,0.75)";
          const past = slotMin(x.time) + 15 <= nowMin;
          return `<div class="col${past ? " past" : ""}" style="height:${h}%;background:${color}"></div>`;
        }).join("");
        const line = document.getElementById("now-line");
        line.style.left = Math.min(100, Math.max(0, (nowMin / (24 * 60)) * 100)) + "%";
        const axis = document.getElementById("chart-axis");
        const hourNow = now.getHours();
        axis.innerHTML = Array.from({ length: 24 }, (_, h) =>
          `<span${h === hourNow ? ' style="color:#fff;font-weight:600"' : ""}>${String(h).padStart(2, "0")}</span>`
        ).join("");
        const run = longestCheapRun(schedule, baseline);
        const cheapEl = document.getElementById("cheap");
        if (run && run.end >= run.start) {
          cheapEl.hidden = false;
          cheapEl.style.left = ((run.start / schedule.length) * 100) + "%";
          cheapEl.style.width = (((run.end - run.start + 1) / schedule.length) * 100) + "%";
        } else cheapEl.hidden = true;
      }

      const outT = num(weather.temperature_c, weather.temperature);
      if (outT != null) document.getElementById("out-temp").innerHTML = outT.toFixed(1) + "<small>°</small>";
      document.getElementById("out-desc").textContent = weather.weather_desc || weather.description || "";

      const rawRooms = []
        .concat(v.climate || v.climates || [])
        .concat(living ? [living] : []);
      const rooms = rawRooms.map(r => ({
        name: shortName(r.name || r.room || r.label),
        t: roomTemp(r),
        h: roomHum(r)
      })).filter(r => r.t != null);
      document.getElementById("rooms").innerHTML = rooms.map(r =>
        `<div class="room"><div class="n">${r.name}</div><div class="t">${r.t.toFixed(1)}°</div><div class="h">${r.h != null ? Math.round(r.h) + "%" : ""}</div></div>`
      ).join("") || `<div class="muted">No indoor sensors</div>`;

      const doors = v.door_window || v.doors || v.sensors || [];
      const open = doors.filter(x => {
        const st = String(x.state || x.status || "CLOSE").toUpperCase();
        return st !== "CLOSE" && st !== "CLOSED";
      });
      const armed = String(v.alarm_state || "").toUpperCase() !== "DISARMED";
      if (open.length === 0) {
        document.getElementById("house-body").innerHTML =
          `<div class="ok">All closed · ${armed ? "Armed" : "Disarmed"}</div>`;
      } else {
        document.getElementById("house-body").innerHTML =
          `<div class="ok warn">${open.length} open · ${armed ? "Armed" : "Disarmed"}</div>
           <div class="open-list">${open.map(x => `<span class="open-chip">${String(x.name || x.label || "Sensor").trim()}</span>`).join("")}</div>`;
      }
    }

    async function tick() {
      let lastErr = null;
      for (const base of STATUS_URLS) {
        try {
          const r = await fetch(base + "?t=" + Date.now(), { cache: "no-store" });
          if (!r.ok) throw new Error(r.status + " " + base);
          const data = await r.json();
          if (!data) throw new Error("empty payload");
          render(data);
          return;
        } catch (e) { lastErr = e; }
      }
      const house = document.getElementById("house-body");
      if (house) house.innerHTML = `<div class="ok warn">No data · ${lastErr && lastErr.message ? lastErr.message : "fetch failed"}</div>`;
    }
    tick();
    setInterval(tick, 5000);
  </script>
</body>
</html>
